AWSTemplateFormatVersion: "2010-09-09"
Description: Isengard DynamoDB Tables

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "isengard-accounts-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: isengard
        - Key: Environment
          Value: !Ref Environment

  RolesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "isengard-roles-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: isengard
        - Key: Environment
          Value: !Ref Environment

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "isengard-users-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: isengard
        - Key: Environment
          Value: !Ref Environment

  GroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "isengard-groups-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: isengard
        - Key: Environment
          Value: !Ref Environment

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "isengard-audit-log-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: isengard
        - Key: Environment
          Value: !Ref Environment

  PolicyTemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "isengard-policy-templates-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: isengard
        - Key: Environment
          Value: !Ref Environment

  ViolationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "isengard-violations-${Environment}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: isengard
        - Key: Environment
          Value: !Ref Environment

Outputs:
  AccountsTableName:
    Value: !Ref AccountsTable
    Export:
      Name: !Sub "${Environment}-AccountsTableName"
  AccountsTableArn:
    Value: !GetAtt AccountsTable.Arn
    Export:
      Name: !Sub "${Environment}-AccountsTableArn"
  RolesTableName:
    Value: !Ref RolesTable
    Export:
      Name: !Sub "${Environment}-RolesTableName"
  RolesTableArn:
    Value: !GetAtt RolesTable.Arn
    Export:
      Name: !Sub "${Environment}-RolesTableArn"
  UsersTableName:
    Value: !Ref UsersTable
    Export:
      Name: !Sub "${Environment}-UsersTableName"
  UsersTableArn:
    Value: !GetAtt UsersTable.Arn
    Export:
      Name: !Sub "${Environment}-UsersTableArn"
  GroupsTableName:
    Value: !Ref GroupsTable
    Export:
      Name: !Sub "${Environment}-GroupsTableName"
  GroupsTableArn:
    Value: !GetAtt GroupsTable.Arn
    Export:
      Name: !Sub "${Environment}-GroupsTableArn"
  AuditLogTableName:
    Value: !Ref AuditLogTable
    Export:
      Name: !Sub "${Environment}-AuditLogTableName"
  AuditLogTableArn:
    Value: !GetAtt AuditLogTable.Arn
    Export:
      Name: !Sub "${Environment}-AuditLogTableArn"
  PolicyTemplatesTableName:
    Value: !Ref PolicyTemplatesTable
    Export:
      Name: !Sub "${Environment}-PolicyTemplatesTableName"
  PolicyTemplatesTableArn:
    Value: !GetAtt PolicyTemplatesTable.Arn
    Export:
      Name: !Sub "${Environment}-PolicyTemplatesTableArn"
  ViolationsTableName:
    Value: !Ref ViolationsTable
    Export:
      Name: !Sub "${Environment}-ViolationsTableName"
  ViolationsTableArn:
    Value: !GetAtt ViolationsTable.Arn
    Export:
      Name: !Sub "${Environment}-ViolationsTableArn"
